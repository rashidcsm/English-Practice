<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ইংরেজি স্পিকিং প্র্যাকটিস</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI','Noto Sans Bengali',sans-serif; background: linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; padding:16px; display:flex; flex-direction:column; align-items:center; }
  h1 { color:#fff; font-size:20px; margin-bottom:12px; text-align:center; }
  .scoreboard { width:100%; max-width:480px; background:rgba(255,255,255,.95); border-radius:16px; padding:12px; margin-bottom:12px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; box-shadow:0 6px 20px rgba(0,0,0,.15); }
  .stat { text-align:center; } .stat .num { font-size:20px; font-weight:800; } .stat .lbl { font-size:11px; color:#64748b; }
  .num.green{color:#16a34a;} .num.red{color:#dc2626;} .num.blue{color:#6366f1;} .num.orange{color:#f59e0b;}
  .reset-btn { grid-column:1/-1; background:#e2e8f0; color:#475569; border:none; border-radius:10px; padding:6px; font-size:12px; font-weight:600; cursor:pointer; }
  .card { background:#fff; border-radius:20px; padding:22px; width:100%; max-width:480px; box-shadow:0 10px 30px rgba(0,0,0,.25); border:4px solid #fff; transition:.3s; margin-bottom:14px; }
  .card.correct{border-color:#22c55e;background:#f0fdf4;} .card.wrong{border-color:#ef4444;background:#fef2f2;}
  .en-sentence{font-size:22px;font-weight:700;color:#1e293b;margin-bottom:10px;line-height:1.4;}
  .pronunciation{font-size:15px;color:#7c3aed;margin-bottom:6px;font-style:italic;} .bangla{font-size:16px;color:#475569;margin-bottom:16px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;}
  button{border:none;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;flex:1;min-width:120px;}
  .btn-mic{background:#6366f1;color:#fff;} .btn-mic.recording{background:#ef4444;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
  .btn-ok{background:#22c55e;color:#fff;} .btn-speak{background:#f59e0b;color:#fff;} .btn-replay{background:#8b5cf6;color:#fff;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .status{margin-top:12px;font-size:15px;font-weight:600;min-height:22px;} .status.good{color:#16a34a;} .status.bad{color:#dc2626;}
  .heard{font-size:13px;color:#64748b;margin-top:6px;}
  .agent{width:100%;max-width:480px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);}
  .agent h2{font-size:16px;color:#4c1d95;margin-bottom:10px;} .chat-box{max-height:220px;overflow-y:auto;margin-bottom:10px;}
  .msg{padding:8px 12px;border-radius:10px;margin-bottom:6px;font-size:14px;line-height:1.5;white-space:pre-wrap;} .msg.user{background:#ede9fe;color:#4c1d95;text-align:right;} .msg.bot{background:#f1f5f9;color:#1e293b;}
  .chat-input{display:flex;gap:6px;align-items:stretch;} .chat-input input{flex:1 1 0;min-width:0;width:0;padding:10px;border:2px solid #ddd6fe;border-radius:10px;font-size:14px;outline:none;} .chat-input input:focus{border-color:#8b5cf6;}
  .chat-input button{flex:0 0 auto;background:#8b5cf6;color:#fff;min-width:auto;padding:10px 12px;font-size:14px;}
  .chat-input .agent-mic{background:#6366f1;padding:10px 9px;}
  .chat-input .agent-lang{background:#64748b;padding:10px 8px;font-size:13px;}
  .chat-input .agent-mic.recording{background:#ef4444;animation:pulse 1s infinite;}
  .loading{display:inline-block;width:12px;height:12px;border:2px solid #c4b5fd;border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== মডাল ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
    z-index: 999; align-items: center; justify-content: center;
    padding: 20px; animation: fadeIn .2s ease;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .modal-box {
    background: #fff; border-radius: 20px; padding: 24px;
    width: 100%; max-width: 340px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    animation: popIn .25s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes popIn { from{transform:scale(.85);opacity:0;} to{transform:scale(1);opacity:1;} }
  .modal-icon { font-size: 40px; margin-bottom: 10px; }
  .modal-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
  .modal-text { font-size: 14px; color: #64748b; margin-bottom: 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; min-width: auto; padding: 12px; font-size: 15px; border-radius: 12px; }
  .modal-cancel { background: #e2e8f0; color: #475569; }
  .modal-cancel:hover { background: #cbd5e1; }
  .modal-confirm { background: #ef4444; color: #fff; }
  .modal-confirm:hover { background: #dc2626; }
</style>
</head>
<body>
<h1>🎯 ইংরেজি স্পিকিং প্র্যাকটিস</h1>
<div id="loadInfo" style="color:rgba(255,255,255,.9);font-size:12px;margin:-6px 0 10px;text-align:center;"></div>

<div class="scoreboard">
  <div class="stat"><div class="num green" id="statCorrect">0</div><div class="lbl">সঠিক</div></div>
  <div class="stat"><div class="num red" id="statWrong">0</div><div class="lbl">ভুল</div></div>
  <div class="stat"><div class="num orange" id="statStreak">0</div><div class="lbl">স্ট্রিক</div></div>
  <div class="stat"><div class="num blue" id="statAcc">0%</div><div class="lbl">নির্ভুলতা</div></div>
  <button class="reset-btn" id="resetBtn">🔄 স্কোর রিসেট</button>
</div>

<div class="card" id="card">
  <div class="en-sentence" id="en">Loading...</div>
  <div class="pronunciation" id="pron">—</div>
  <div class="bangla" id="bn">—</div>
  <div class="controls">
    <button class="btn-mic" id="micBtn">🎤 বলুন</button>
    <button class="btn-speak" id="speakBtn">🔊 শুনুন</button>
  </div>
  <div class="controls" style="margin-top:10px;">
    <button class="btn-replay" id="replayBtn">🎧 আমার রেকর্ডিং শুনুন</button>
    <button class="btn-ok" id="okBtn">✅ পরের বাক্য</button>
  </div>
  <div class="status" id="status"></div>
  <div class="heard" id="heard"></div>
  

<div class="agent">
  <h2>🤖 এআই এজেন্ট</h2>
  <div class="chat-box" id="chatBox"><div class="msg bot">হ্যালো! যেকোনো ইংরেজি শব্দের অর্থ ও বাংলা অনুবাদ জানতে প্রশ্ন করুন। উদাহরণ: "serendipity এর অর্থ কী?"</div></div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="আপনার প্রশ্ন..." />
    <button class="agent-lang" id="agentLangBtn" title="মাইকের ভাষা বদলান">বাং</button>
    <button class="agent-mic" id="agentMicBtn" title="মাইক দিয়ে প্রশ্ন করুন">🎤</button>
    <button id="sendBtn">পাঠান</button>
  </div>
</div>

<!-- রিসেট কনফার্মেশন মডাল -->
<div class="modal-overlay" id="resetModal">
  <div class="modal-box">
    <div class="modal-icon">🔄</div>
    <div class="modal-title">স্কোর রিসেট করবেন?</div>
    <div class="modal-text">আপনার সব সঠিক, ভুল ও স্ট্রিকের হিসাব শূন্য হয়ে যাবে। এটি ফেরানো যাবে না।</div>
    <div class="modal-actions">
      <button class="modal-cancel" id="modalCancel">বাতিল</button>
      <button class="modal-confirm" id="modalConfirm">হ্যাঁ, রিসেট</button>
    </div>
  </div>
</div>

<script>
/* ============ App Inventor মোড চেনা ============ */
// App Inventor-এর WebViewer-এ window.AppInventor থাকে। থাকলে মাইক/ভয়েস/রেকর্ডিং অ্যাপের কম্পোনেন্টে যাবে।
const IN_APP = !!(window.AppInventor && window.AppInventor.setWebViewString);
// অ্যাপের ভেতরে পেজ ছোট করে দেখানো (০.৮ = ৮০%; আরও ছোট চাইলে ০.৭, বড় চাইলে ০.৯ দিন)
const APP_ZOOM = 0.8;
if(IN_APP){ document.documentElement.style.zoom = APP_ZOOM; }

// ডিবাগ লাইন: অ্যাপে ব্রিজ পাওয়া গেল কিনা দেখায় (কাজ করলে এই লাইন মুছে ফেলতে পারেন)
function sendToApp(cmd){
  try { window.AppInventor.setWebViewString(cmd); } catch(e){}
}

/* ============ ডিফল্ট বাক্য ============ */
let sentences = [
  { en:"I am learning English.", pron:"আই অ্যাম লার্নিং ইংলিশ", bn:"আমি ইংরেজি শিখছি।", words:{"learning":"শিখছি"} },
  { en:"My name is Rahim.", pron:"মাই নেম ইজ রহিম", bn:"আমার নাম রহিম।", words:{"name":"নাম"} },
  { en:"How are you today?", pron:"হাউ আর ইউ টুডে", bn:"আজ কেমন আছেন?", words:{"today":"আজ"} },
  { en:"I live in Bangladesh.", pron:"আই লিভ ইন বাংলাদেশ", bn:"আমি বাংলাদেশে থাকি।", words:{"live":"বাস করা"} },
  { en:"Thank you very much.", pron:"থ্যাংক ইউ ভেরি মাচ", bn:"অনেক ধন্যবাদ।", words:{"thank":"ধন্যবাদ"} }
];

/* ============ স্কোর ============ */
let score = {correct:0, wrong:0, streak:0, bestStreak:0};
try { score = JSON.parse(localStorage.getItem('engScore2') || '{"correct":0,"wrong":0,"streak":0,"bestStreak":0}'); } catch(e){}
function saveScore(){ try { localStorage.setItem('engScore2', JSON.stringify(score)); } catch(e){} }
function updateScoreboard(){
  document.getElementById('statCorrect').textContent = score.correct;
  document.getElementById('statWrong').textContent = score.wrong;
  document.getElementById('statStreak').textContent = score.streak;
  const total = score.correct + score.wrong;
  document.getElementById('statAcc').textContent = (total ? Math.round(score.correct/total*100) : 0) + '%';
}

/* ============ রিসেট মডাল ============ */
const resetModal = document.getElementById('resetModal');
document.getElementById('resetBtn').onclick = () => {
  resetModal.classList.add('show');
};
document.getElementById('modalCancel').onclick = () => {
  resetModal.classList.remove('show');
};
document.getElementById('modalConfirm').onclick = () => {
  score = {correct:0, wrong:0, streak:0, bestStreak:0};
  saveScore();
  updateScoreboard();
  resetModal.classList.remove('show');
};
resetModal.addEventListener('click', (e) => {
  if(e.target === resetModal) resetModal.classList.remove('show');
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') resetModal.classList.remove('show');
});

/* ============ এলিমেন্ট ============ */
const card=document.getElementById('card'), enEl=document.getElementById('en'), pronEl=document.getElementById('pron'),
      bnEl=document.getElementById('bn'), micBtn=document.getElementById('micBtn'), speakBtn=document.getElementById('speakBtn'),
      okBtn=document.getElementById('okBtn'), replayBtn=document.getElementById('replayBtn'),
      statusEl=document.getElementById('status'), heardEl=document.getElementById('heard');

let currentIndex = 0, hasScored = false, recognition = null, isRecording = false;
let agentMode = false; // true হলে মাইকের ফল এআই এজেন্টের কাছে যাবে, বাক্য যাচাইয়ে নয়
let agentTimer = null; // ১৫ সেকেন্ডে ফল না এলে এজেন্ট মোড নিজে থেকে বন্ধ হয়

/* ============ বাক্য দেখানো ============ */
function loadSentence(){
  const s = sentences[currentIndex % sentences.length];
  enEl.textContent = s.en;
  pronEl.textContent = "উচ্চারণ: " + (s.pron || "—");
  bnEl.textContent = "অর্থ: " + (s.bn || "—");
  card.classList.remove('correct','wrong'); statusEl.textContent=""; statusEl.className="status"; heardEl.textContent=""; hasScored=false;
}

/* ============ মিল ============ */
function normalize(str){ return str.toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ').trim(); }
function similarity(a,b){
  a=normalize(a); b=normalize(b); if(a===b) return 1;
  const wa=a.split(' '), wb=b.split(' '); let m=0; const used=new Array(wb.length).fill(false);
  for(const w of wa) for(let i=0;i<wb.length;i++){ if(!used[i]&&wb[i]===w){m++;used[i]=true;break;} }
  return (2*m)/(wa.length+wb.length);
}

/* ============ ফলাফল যাচাই (ব্রাউজার ও App Inventor দুই জায়গা থেকেই কল হয়) ============ */
function handleSaid(said){
  // App Inventor-এর UriEncode স্পেসকে "+" বানায়, সেটা আবার স্পেস করা হচ্ছে
  said = String(said).replace(/\+/g, ' ');
  // এআই এজেন্টের মাইক চাপা থাকলে ফল প্রশ্ন হিসেবে পাঠানো হবে
  if(agentMode){
    agentMode = false; clearTimeout(agentTimer);
    agentMicBtn.textContent = "🎤"; agentMicBtn.classList.remove('recording');
    chatInput.value = said;
    send();
    return;
  }
  micBtn.textContent = "🎤 বলুন"; micBtn.classList.remove('recording');
  heardEl.textContent = 'আপনি বলেছেন: "'+said+'"';
  const target = sentences[currentIndex % sentences.length].en;
  const sc = similarity(said, target);
  if(sc>=0.7){
    card.classList.remove('wrong'); card.classList.add('correct');
    statusEl.textContent="✅ সঠিক ("+Math.round(sc*100)+"%)"; statusEl.className="status good";
    if(!hasScored){ score.correct++; score.streak++; if(score.streak>score.bestStreak) score.bestStreak=score.streak; hasScored=true; saveScore(); updateScoreboard(); }
  } else {
    card.classList.remove('correct'); card.classList.add('wrong');
    statusEl.textContent="❌ আবার চেষ্টা ("+Math.round(sc*100)+"%)"; statusEl.className="status bad";
    if(!hasScored){ score.wrong++; score.streak=0; hasScored=true; saveScore(); updateScoreboard(); }
  }
}

/* App Inventor থেকে কল হবে: ত্রুটি/কিছু শোনা না গেলে */
function handleAppError(msg){
  if(agentMode){
    agentMode = false;
    agentMicBtn.textContent = "🎤"; agentMicBtn.classList.remove('recording');
    addMsg("⚠️ " + (msg || "কিছু শোনা যায়নি, আবার চেষ্টা করুন"), 'bot');
    return;
  }
  micBtn.textContent = "🎤 বলুন"; micBtn.classList.remove('recording');
  statusEl.textContent = "⚠️ " + (msg || "কিছু শোনা যায়নি, আবার চেষ্টা করুন");
  statusEl.className = "status bad";
}

/* App Inventor থেকে কল হবে: রেকর্ডিং প্লে শুরু হলে */
function handleAppStatus(msg){
  statusEl.textContent = msg; statusEl.className = "status";
}

/* ============ ভয়েস রিকগনিশন (ব্রাউজার মোড) ============ */
if(!IN_APP){
  if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR(); recognition.lang='en-US'; recognition.interimResults=false; recognition.maxAlternatives=1;
    recognition.onstart = ()=>{ isRecording=true; micBtn.textContent="⏹️ শুনছি..."; micBtn.classList.add('recording'); statusEl.textContent="🎧 বলুন..."; statusEl.className="status"; };
    recognition.onresult = (e)=>{ handleSaid(e.results[0][0].transcript); };
    recognition.onerror = (e)=>{ statusEl.textContent="⚠️ "+e.error; statusEl.className="status bad"; };
    recognition.onend = ()=>{ isRecording=false; micBtn.textContent="🎤 বলুন"; micBtn.classList.remove('recording'); };
  } else { micBtn.disabled=true; micBtn.textContent="মাইক সাপোর্ট নেই"; }
}

/* ============ মাইক বাটন ============ */
micBtn.onclick = ()=>{
  if(IN_APP){
    // উপরের মাইক চাপলে এজেন্ট মোড অবশ্যই বন্ধ, নইলে ফল এজেন্টের চ্যাটে চলে যায়
    agentMode = false; clearTimeout(agentTimer);
    agentMicBtn.textContent = "🎤"; agentMicBtn.classList.remove('recording');
    card.classList.remove('correct','wrong');
    heardEl.textContent = "";
    micBtn.textContent = "⏹️ শুনছি..."; micBtn.classList.add('recording');
    statusEl.textContent = "🎧 বলুন..."; statusEl.className = "status";
    sendToApp("MIC");
    return;
  }
  if(!recognition) return;
  if(isRecording) recognition.stop();
  else { card.classList.remove('correct','wrong'); statusEl.textContent=""; try{recognition.start();}catch(e){} }
};

/* ============ শুনুন বাটন ============ */
speakBtn.onclick = ()=>{
  const s = sentences[currentIndex % sentences.length];
  if(IN_APP){ sendToApp("SPEAK:" + s.en); return; }
  const u = new SpeechSynthesisUtterance(s.en); u.lang='en-US'; u.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(u);
};

okBtn.onclick = ()=>{ currentIndex++; loadSentence(); };

/* ============ আমার রেকর্ডিং শুনুন ============ */
let mediaRecorder = null, audioChunks = [], lastRecordingURL = null;
replayBtn.onclick = async ()=>{
  if(IN_APP){
    statusEl.textContent = "🎙️ ৩ সেকেন্ড বলুন..."; statusEl.className = "status";
    sendToApp("REC");
    return;
  }
  if(lastRecordingURL){
    const audio = new Audio(lastRecordingURL);
    const s = sentences[currentIndex % sentences.length];
    const ref = new SpeechSynthesisUtterance(s.en); ref.lang='en-US'; ref.rate=0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(ref);
    await new Promise(r=>{ ref.onend=r; setTimeout(r,2000); });
    setTimeout(()=>{ audio.play(); }, 400);
    statusEl.textContent = "🔊 আদর্শ → আপনার কণ্ঠ তুলনা করুন"; statusEl.className="status";
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream); audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(audioChunks, {type:'audio/webm'});
      lastRecordingURL = URL.createObjectURL(blob);
      const audio = new Audio(lastRecordingURL);
      const s = sentences[currentIndex % sentences.length];
      const ref = new SpeechSynthesisUtterance(s.en); ref.lang='en-US'; ref.rate=0.9;
      speechSynthesis.cancel(); speechSynthesis.speak(ref);
      ref.onend = ()=>{ setTimeout(()=>{ audio.play(); }, 400); };
      stream.getTracks().forEach(t=>t.stop());
      statusEl.textContent = "🔊 আদর্শ → আপনার কণ্ঠ"; statusEl.className="status";
    };
    mediaRecorder.start();
    statusEl.textContent = "🎙️ ৩ সেকেন্ড বলুন..."; statusEl.className="status";
    setTimeout(()=>{ if(mediaRecorder.state==='recording') mediaRecorder.stop(); }, 3500);
  } catch(e){ statusEl.textContent="মাইক অনুমতি দিন"; statusEl.className="status bad"; }
};

/* ============ অনলাইন অভিধান ============ */
async function lookupWord(word){
  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if(!res.ok) return `"${word}" এর অর্থ পাওয়া যায়নি। বানান ঠিক আছে কিনা দেখুন।`;
    const data = await res.json();
    const entry = data[0];
    const phonetic = entry.phonetic || (entry.phonetics?.[0]?.text) || "";
    const meanings = entry.meanings?.slice(0, 2).map(m => {
      const def = m.definitions?.[0]?.definition || "";
      const ex = m.definitions?.[0]?.example ? `\n   উদাহরণ: ${m.definitions[0].example}` : "";
      return `【${m.partOfSpeech}】${def}${ex}`;
    }).join("\n\n") || "কোনো সংজ্ঞা পাওয়া যায়নি";
    return `"${entry.word}" ${phonetic}\n\n${meanings}`;
  } catch(e) {
    return `অনলাইন অভিধান সংযোগ ব্যর্থ: ${e.message}`;
  }
}

/* ============ বাংলা অনুবাদ ============ */
async function translateToBangla(text){
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    if(Array.isArray(data) && data[0] && Array.isArray(data[0])){
      const translated = data[0].map(item => item[0]).filter(Boolean).join('');
      return translated || null;
    }
    return null;
  } catch(e) {
    return null;
  }
}

/* ============ যেকোনো ভাষা থেকে অনুবাদ ============ */
async function translateText(text, sl, tl){
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    if(Array.isArray(data) && Array.isArray(data[0])){
      return data[0].map(item => item[0]).filter(Boolean).join('') || null;
    }
    return null;
  } catch(e) { return null; }
}

/* ============ এজেন্ট ============ */
const chatBox=document.getElementById('chatBox'), chatInput=document.getElementById('chatInput'), sendBtn=document.getElementById('sendBtn');
function addMsg(t,w){ const d=document.createElement('div'); d.className='msg '+w; d.textContent=t; chatBox.appendChild(d); chatBox.scrollTop=chatBox.scrollHeight; }
function addLoading(){
  const d=document.createElement('div'); d.className='msg bot'; d.id='loadingMsg';
  d.innerHTML = '<span class="loading"></span>খোঁজা হচ্ছে...';
  chatBox.appendChild(d); chatBox.scrollTop=chatBox.scrollHeight;
}
function removeLoading(){ const el=document.getElementById('loadingMsg'); if(el) el.remove(); }

async function reply(q){
  const t=q.toLowerCase().trim(), cur=sentences[currentIndex % sentences.length];

  if(/স্কোর|score/.test(t)){
    const tot=score.correct+score.wrong;
    return `✅ সঠিক: ${score.correct}\n❌ ভুল: ${score.wrong}\n🔥 স্ট্রিক: ${score.streak}\n🏆 সর্বোচ্চ: ${score.bestStreak}\n🎯 নির্ভুলতা: ${tot?Math.round(score.correct/tot*100):0}%`;
  }

  if(/অর্থ|মানে|meaning|translate|শব্দ/.test(t)){
    const curWords = cur.words || {};
    for(const w in curWords){
      if(t.includes(w.toLowerCase())) return `"${w}" শব্দের অর্থ: ${curWords[w]}\n\n(বর্তমান বাক্য: ${cur.en} → ${cur.bn})`;
    }
    for(const s of sentences){
      const ws = s.words || {};
      for(const w in ws){
        if(t.includes(w.toLowerCase())) return `"${w}" শব্দের অর্থ: ${ws[w]}\n\nউদাহরণ: ${s.en} → ${s.bn}`;
      }
    }

    // "meaning of beautiful" থেকে meaning/of বাদ দিয়ে আসল শব্দ (beautiful) নেওয়া
    const stopWords = ['meaning','means','mean','of','the','what','is','word','translate','translation','in','bangla','bengali','tell','me','a','an','to','for','define'];
    const latinWords = (t.match(/[a-zA-Z]+/g) || []).filter(w => !stopWords.includes(w));
    const wordMatch = latinWords.length ? [null, latinWords[0]] : null;
    if(wordMatch){
      addLoading();
      const dictResult = await lookupWord(wordMatch[1]);
      let bnTranslation = null;
      if(!dictResult.includes("পাওয়া যায়নি") && !dictResult.includes("ব্যর্থ")){
        const lines = dictResult.split('\n');
        const defLine = lines.find(l => l.startsWith('【'));
        if(defLine){
          const englishDef = defLine.replace(/【[^】]+】/,'').trim();
          bnTranslation = await translateToBangla(englishDef);
        }
      }
      removeLoading();

      if(bnTranslation){
        return dictResult + `\n\n🇧🇩 বাংলা অনুবাদ: ${bnTranslation}`;
      }
      return dictResult;
    }
    // বাংলা হরফে বলা/লেখা শব্দ (যেমন "সেরেনডিপিটি এর অর্থ কী"): ইংরেজিতে রূপান্তর করে অভিধানে খোঁজা
    const bnStopTokens = ['অর্থ','মানে','শব্দের','শব্দটির','শব্দটা','শব্দ','কী','কি','বলো','বলুন','বল','হলো','হল','এর','জানতে','চাই','জানাও','ইংরেজি','বাংলা','ইংলিশ','ট্রান্সলেট','অনুবাদ','কত'];
    const bnWord = q.split(/\s+/)
      .map(w => w.replace(/[?।.!,]/g,''))
      .filter(w => w && !bnStopTokens.includes(w) && /[\u0980-\u09FF]/.test(w))
      .join(' ');
    if(bnWord){
      addLoading();
      const enWord = await translateText(bnWord, 'bn', 'en');
      if(enWord){
        const clean = enWord.trim().toLowerCase().replace(/[^a-z\s'-]/g,'').trim();
        if(clean && !clean.includes(' ')){
          const detail = await reply("meaning " + clean);
          removeLoading();
          return `🔤 "${bnWord}" → ${clean}\n\n` + detail;
        }
        removeLoading();
        return `"${bnWord}" ইংরেজিতে: ${enWord}`;
      }
      removeLoading();
    }
    return `বর্তমান বাক্য: ${cur.en}\nঅর্থ: ${cur.bn}\nউচ্চারণ: ${cur.pron}`;
  }

  if(/উচ্চারণ|pronunciation/.test(t)) return "🔊 শুনে অনুকরণ করুন → 🎤 রেকর্ড করুন → 🎧 নিজের কণ্ঠ শুনুন। প্রতিদিন ১০ মিনিট।";
  if(/গ্রামার|grammar/.test(t)) return "📚 প্রথমে Subject + Verb + Object গঠন শিখুন। এরপর ১২টি Tense অনুশীলন করুন। প্রতিদিন ১টি নিয়ম।";
  if(/ভুল|problem|কাজ করছে না/.test(t)) return "Chrome ব্যবহার করুন, মাইক অনুমতি দিন, ধীরে স্পষ্ট বলুন, ইন্টারনেট চেক করুন।";
  if(/ডেটা|বাক্য যোগ|dataset/.test(t)) return "manifest.json-এ ফাইলের নাম যোগ করুন। প্রতিটি ফাইল: [{en, pron, bn, words}]।";
  if(/ধন্যবাদ|thank/.test(t)) return "আপনাকেও ধন্যবাদ! অনুশীলন চালিয়ে যান 💪";

  return "জিজ্ঞাসা করুন:\n• যেকোনো ইংরেজি শব্দের অর্থ ও বাংলা অনুবাদ\n• উচ্চারণ টিপস\n• গ্রামার\n• আপনার স্কোর";
}

async function send(){
  const q=chatInput.value.trim(); if(!q) return;
  addMsg(q,'user'); chatInput.value='';
  const ans = await reply(q);
  addMsg(ans,'bot');
}
sendBtn.onclick=send;

/* ============ এআই এজেন্টে মাইক দিয়ে প্রশ্ন ============ */
const agentMicBtn = document.getElementById('agentMicBtn');
let agentRec = null;
let agentLang = 'bn'; // 'bn' = বাংলা, 'en' = ইংরেজি
const agentLangBtn = document.getElementById('agentLangBtn');
agentLangBtn.onclick = ()=>{
  agentLang = (agentLang === 'bn') ? 'en' : 'bn';
  agentLangBtn.textContent = (agentLang === 'bn') ? 'বাং' : 'EN';
};
agentMicBtn.onclick = ()=>{
  if(IN_APP){
    // অ্যাপে: একই "MIC" কমান্ড, তবে ফল এজেন্টে যাবে
    agentMode = true;
    agentMicBtn.textContent = "⏹️"; agentMicBtn.classList.add('recording');
    clearTimeout(agentTimer);
    agentTimer = setTimeout(()=>{
      if(agentMode){ agentMode = false; agentMicBtn.textContent = "🎤"; agentMicBtn.classList.remove('recording'); }
    }, 15000);
    sendToApp(agentLang === 'bn' ? "MICBN" : "MIC");
    return;
  }
  // ব্রাউজারে
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ addMsg("এই ব্রাউজারে মাইক সাপোর্ট নেই।", 'bot'); return; }
  if(agentRec){ agentRec.stop(); return; }
  agentRec = new SR(); agentRec.lang = (agentLang === 'bn') ? 'bn-BD' : 'en-US'; agentRec.interimResults = false; agentRec.maxAlternatives = 1;
  agentRec.onstart = ()=>{ agentMicBtn.textContent = "⏹️"; agentMicBtn.classList.add('recording'); };
  agentRec.onresult = (e)=>{ chatInput.value = e.results[0][0].transcript; send(); };
  agentRec.onerror = (e)=>{ addMsg("⚠️ " + e.error, 'bot'); };
  agentRec.onend = ()=>{ agentMicBtn.textContent = "🎤"; agentMicBtn.classList.remove('recording'); agentRec = null; };
  try{ agentRec.start(); }catch(e){ agentRec = null; }
};
chatInput.onkeypress=e=>{ if(e.key==='Enter') send(); };

/* ============ শুরু: manifest.json থেকে সব ফাইল লোড ============ */
updateScoreboard();
enEl.textContent = "Loading...";

async function loadAllSentences(){
  let files = [];
  try {
    const res = await fetch('manifest.json');
    if(res.ok) files = await res.json();
  } catch(e) { /* manifest না থাকলে ডিফল্ট ব্যবহার */ }

  if(!Array.isArray(files) || files.length === 0){
    files = ['sentences.json'];
  }

  const all = [];
  for(const file of files){
    try {
      const r = await fetch(file);
      if(!r.ok) continue;
      const data = await r.json();
      if(Array.isArray(data)){
        data.forEach(s => {
          const en = s.en || s.english || "";
          if(en){
            all.push({
              en,
              pron: s.pron || s.pronunciation || "",
              bn: s.bn || s.bangla || "",
              words: s.words || {}
            });
          }
        });
      }
    } catch(e) { /* একটি ফাইল ব্যর্থ হলে বাকিগুলো চালিয়ে যান */ }
  }

  if(all.length > 0){
    sentences = all;
    currentIndex = 0;
  }
  loadSentence();
  // বাক্য সংখ্যা আলাদা জায়গায় দেখানো হয়, যাতে মাইকের ফলাফল এটা মুছে না দেয়
  document.getElementById('loadInfo').textContent = all.length > 5
    ? `📚 ${all.length}টি বাক্য লোড হয়েছে (${files.length}টি ফাইল)`
    : `📖 ডিফল্ট ${sentences.length}টি বাক্য (JSON পাওয়া যায়নি)`;
}

loadAllSentences();
